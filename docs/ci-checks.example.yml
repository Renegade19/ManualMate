name: docs-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка документации
        run: python3 scripts/check_docs.py
      - name: Зависимости Python
        run: python -m pip install -r requirements.txt
      - name: Unit-тесты и API
        run: python -m pytest -q
      - name: Сборка корпуса и поиск без LLM
        run: |
          python scripts/prepare_corpus.py --skip-pdf-check
          git diff --exit-code corpus/processed/
          python -m benchmark.run --retrieval-only --output tmp/ci-retrieval.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Синтаксис JavaScript
        run: |
          node --check frontend/script.js
          node --check frontend/api.js
          node --check frontend/demo.js
          node --check frontend/config.js
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Зависимости браузерных проверок
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Интерфейс в браузере
        run: PYTHON=python pnpm test:frontend
